name: CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Check formatting
        run: npm exec prettier --check src/

      - name: Check linting
        run: npm run lint --max-warnings=0
