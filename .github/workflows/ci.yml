name: Formatting

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"   # optional; does NOT install pnpm

      - name: Install pnpm (recommended)
        uses: pnpm/action-setup@v2
        with:
          version: "11.11.0"    # pin to your desired pnpm version

      - name: Verify pnpm (debug)
        run: |
          echo "node: $(node -v)"
          echo "npm:  $(npm -v)"
          echo "pnpm: $(pnpm -v || true)"
          which pnpm || true
          echo "PATH=$PATH"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm exec prettier --check src/

      - name: Check linting
        run: pnpm run lint -- --max-warnings=0
